      if (screen === "opening-objective") {
        if (!isSide(side)) return radarFallback(mapId, "T", "opening");
        const spawn = getSpawnById(route.spawnId, mapData);
        if (!spawn || spawn.side !== side) return radarFallback(mapId, side, "opening");
        const next = { version: 1, screen: "opening-objective", mapId: mapId, side: side, spawnId: spawn.id };
        if (typeof route.objective === "string") next.objective = route.objective;
        return next;
      }

      if (screen === "opening-plan" || screen === "opening-step") {
        if (!isSide(side)) return radarFallback(mapId, "T", "opening");
        const plan = getPlanById(route.planId, mapData);
        if (!permittedPlan(plan) || plan.side !== side) return radarFallback(mapId, side, "opening");
        const spawn = route.spawnId ? getSpawnById(route.spawnId, mapData) : null;
        const next = {
          version: 1,
          screen: screen,
          mapId: mapId,
          side: side,
          planId: plan.id,
          objective: plan.objective
        };
        if (spawn && spawn.side === side) next.spawnId = spawn.id;
        if (screen === "opening-step") {
          const max = plan.steps.length + 1;
          const stepIndex = Number.isInteger(route.stepIndex) ? route.stepIndex : 1;
          next.stepIndex = Math.min(Math.max(stepIndex, 1), max);
        }
        return next;
      }

      return mapsRoute();
    }

    function parentRoute(route) {
      const current = normalizeRoute(route);
      switch (current.screen) {
        case "side":
          return mapsRoute();
        case "radar":
          return { version: 1, screen: "side", mapId: current.mapId };
        case "nearby":
          return radarFallback(current.mapId, current.side, "nearby");
        case "lineup":
          if (current.planId && current.stepIndex) {
            return {
              version: 1,
              screen: "opening-step",
              mapId: current.mapId,
              side: current.side,
              planId: current.planId,
              stepIndex: current.stepIndex,
              spawnId: current.spawnId,
              objective: current.objective
            };
          }
          if (current.point) {
            return { version: 1, screen: "nearby", mapId: current.mapId, side: current.side, point: current.point };
          }
          if (current.returnTo === "favorites") return { version: 1, screen: "favorites" };
          return radarFallback(current.mapId, current.side, "nearby");
        case "favorites":
          return mapsRoute();
        case "opening-objective":
          return radarFallback(current.mapId, current.side, "opening");
        case "opening-plan":
          if (current.spawnId) {
            return {
              version: 1,
              screen: "opening-objective",
              mapId: current.mapId,
              side: current.side,
              spawnId: current.spawnId,
              objective: current.objective
            };
          }
          return radarFallback(current.mapId, current.side, "opening");
        case "opening-step":
          return {
            version: 1,
            screen: "opening-plan",
            mapId: current.mapId,
            side: current.side,
            planId: current.planId,
            spawnId: current.spawnId,
            objective: current.objective
          };
        default:
          return mapsRoute();
      }
    }

    function lineupEntrySort(a, b) {
      const bucket = { current: 0, neighbor: 1, far: 2 };
      return (bucket[a.proximity] - bucket[b.proximity]) ||
        (a.distance - b.distance) ||
        (b.lineup.editorialPriority - a.lineup.editorialPriority) ||
        a.lineup.id.localeCompare(b.lineup.id);
    }

    function queryNearbyLineups(context) {
      const mapData = context.mapData;
      const point = context.point;
      const zone = point ? findZoneForPoint(point, mapData.zones) : null;
      const allowedZoneIds = zone ? [zone.id].concat(zone.neighborZoneIds) : [];
      const candidates = mapData.lineups.filter(function(lineup) {
        return permittedLineup(lineup) && lineup.side === context.side;
      });

      const decorated = candidates.map(function(lineup) {
        const station = getStationById(lineup.startStationId, mapData);
        const stationZone = getZoneById(station.zoneId, mapData);
        let proximity = "far";
        if (zone) {
          if (station.zoneId === zone.id) proximity = "current";
          else if (allowedZoneIds.indexOf(station.zoneId) !== -1) proximity = "neighbor";
        }
        return {
          lineup: lineup,
          station: station,
          zone: stationZone,
          proximity: proximity,
          distance: point ? distanceSquared(point, station.point) : 0
        };
      });

      return {
        zone: zone,
        nearby: decorated.filter(function(item) { return item.proximity === "current" || item.proximity === "neighbor"; }).sort(lineupEntrySort),
        far: decorated.filter(function(item) { return item.proximity === "far"; }).sort(lineupEntrySort)
      };
    }

    function groupLineupsByGrenade(entries) {
      return NADE_ORDER.map(function(type) {
        return {
          type: type,
          label: NADE_LABELS[type],
          entries: entries.filter(function(item) { return item.lineup.grenadeType === type; })
        };
      }).filter(function(group) { return group.entries.length > 0; });
    }

    function resolveOpeningPlan(context) {
      return context.mapData.openingPlans.find(function(plan) {
        return plan.side === context.side &&
          plan.objective === context.objective &&
          plan.eligibleSpawnAnchorIds.indexOf(context.spawnAnchorId) !== -1 &&
          permittedPlan(plan);
      }) || null;
    }

    function getSpawnLineups(context) {
      return context.mapData.lineups.filter(function(lineup) {
        return lineup.side === context.side &&
          permittedLineup(lineup) &&
          lineup.eligibleSpawnAnchorIds.indexOf(context.spawnAnchorId) !== -1;
      });
    }

    function openingObjectives(side) {
      return side === "T"
        ? [{ id: "t-a", label: "A", detail: "A 进攻" }, { id: "t-mid", label: "中路", detail: "中路控制" }, { id: "t-b", label: "B", detail: "B 进攻" }]
        : [{ id: "ct-a", label: "A", detail: "A 防守" }, { id: "ct-mid", label: "中路", detail: "中路争夺" }, { id: "ct-b", label: "B", detail: "B 防守" }];
    }

    function techniqueKind(lineup) {
      const text = String((lineup && lineup.technique) || "");
      if (/跳投/.test(text)) return "跳投";
      if (/助跑|跑投/.test(text)) return "跑投";
      return "站投";
    }

    function tacticalTitle(lineup) {
      const raw = String((lineup && lineup.purpose) || "")
        .replace(/^演示用途[:：]\s*/, "")
        .replace(/[。．.]$/, "")
        .replace(/快攻$/, "");
      if (raw && raw.length <= 12) return raw;
      const verbs = { smoke: "封", flash: "闪", molotov: "延缓", he: "压制" };
      return (verbs[lineup.grenadeType] || "") + " " + lineup.targetLabel;
    }

    function contentStatusLabel(item) {
      if (!item) return "未知";
      if (item.status === "active") return "已验证";
      if (item.status === "demo") return "交互演示";
      if (item.status === "retired") return "已退役";
      return String(item.status);
    }

    function frameSource(lineup, frame) {
      if (!lineup) return null;
      const key = { stance: "stanceImage", aim: "aimImage", result: "resultImage" }[frame];
      const fromMedia = lineup.media && lineup.media[frame];
      const src = lineup[key] || fromMedia;
      return typeof src === "string" && src.indexOf("data:image/") === 0 ? src : null;
    }

    function nextFrame(frame, direction) {
      const index = FRAME_ORDER.indexOf(frame);
      const current = index === -1 ? 1 : index;
      const next = Math.min(Math.max(current + direction, 0), FRAME_ORDER.length - 1);
      return FRAME_ORDER[next];
    }

    function validateMapData(mapData) {
      const errors = [];
      const allIds = new Set();
      ["zones", "spawnAnchors", "startStations", "lineups", "openingPlans"].forEach(function(key) {
        if (!Array.isArray(mapData[key])) errors.push(key + " 必须为数组");
        (mapData[key] || []).forEach(function(item) {
          if (!item.id || allIds.has(item.id)) errors.push("重复或缺失 ID：" + String(item.id));
          allIds.add(item.id);
        });
      });
      (mapData.zones || []).forEach(function(zone) {
        if (!Array.isArray(zone.polygon) || zone.polygon.length < 3) errors.push("区域多边形无效：" + zone.id);
        zone.neighborZoneIds.forEach(function(id) {
          if (!mapData.zones.some(function(candidate) { return candidate.id === id; })) errors.push("未知邻接区域：" + id);
        });
      });
      (mapData.spawnAnchors || []).forEach(function(spawn) {
        if (!validPoint(spawn.point)) errors.push("出生坐标无效：" + spawn.id);
      });
      (mapData.startStations || []).forEach(function(station) {
        if (!validPoint(station.point) || !mapData.zones.some(function(zone) { return zone.id === station.zoneId; })) {
          errors.push("起投站无效：" + station.id);
        }
      });
      (mapData.lineups || []).forEach(function(lineup) {
        if (!mapData.startStations.some(function(station) { return station.id === lineup.startStationId; })) {
          errors.push("瞄点引用未知起投站：" + lineup.id);
        }
        if (!validPoint(lineup.targetPoint)) errors.push("落点坐标无效：" + lineup.id);
        if (NADE_ORDER.indexOf(lineup.grenadeType) === -1) errors.push("道具类型无效：" + lineup.id);
      });
      (mapData.openingPlans || []).forEach(function(plan) {
        if (plan.requiredLoadout.length > 4) errors.push("购买清单超过单人携带上限：" + plan.id);
        plan.steps.forEach(function(step) {
          if (step.type === "throw" && !mapData.lineups.some(function(lineup) { return lineup.id === step.lineupId; })) {
            errors.push("路线引用未知瞄点：" + plan.id);
          }
        });
      });
      return { ok: errors.length === 0, errors: errors };
    }

    function structuredCloneSafe(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function normalizeNotes(candidate) {
      if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return {};
      const output = {};
      Object.entries(candidate).slice(0, 100).forEach(function(entry) {
        const id = entry[0], note = entry[1];
        if (validLineupId(id) && typeof note === "string") output[id] = note.slice(0, 500);
      });
      return output;
    }

    function normalizeOpeningProgress(candidate, fallbackSide) {
      const empty = structuredCloneSafe(DEFAULT_USER_STATE.opening);
      if (!candidate || typeof candidate !== "object") {
        return empty;
      }
      const mapId = isAvailableMap(candidate.mapId) ? candidate.mapId : null;
      const mapData = mapId ? getMapData(mapId) : null;
      const side = isSide(candidate.side) ? candidate.side : (isSide(fallbackSide) ? fallbackSide : null);
      if (!mapData || !side) return empty;
      const spawn = candidate.spawnId ? getSpawnById(candidate.spawnId, mapData) : null;
      const plan = candidate.planId ? getPlanById(candidate.planId, mapData) : null;
      const spawnOk = spawn && spawn.side === side;
      const planOk = permittedPlan(plan) && plan.side === side;
      return {
        mapId: mapId,
        side: side,
        spawnId: spawnOk ? spawn.id : null,
        objective: typeof candidate.objective === "string" ? candidate.objective : (planOk ? plan.objective : null),
        planId: planOk ? plan.id : null,
        stepIndex: Number.isInteger(candidate.stepIndex) && candidate.stepIndex >= 0 ? candidate.stepIndex : 0
      };
    }

    function migrateUserState(rawV2, rawV1) {
      if (rawV2 && rawV2.schemaVersion === 2) {
        return {
          schemaVersion: 2,
          defaultSide: isSide(rawV2.defaultSide) ? rawV2.defaultSide : "T",
          favorites: Array.isArray(rawV2.favorites) ? rawV2.favorites.filter(validLineupId).slice(0, 100) : [],
          notes: normalizeNotes(rawV2.notes),
          recent: Array.isArray(rawV2.recent) ? rawV2.recent.filter(validLineupId).slice(0, 20) : [],
          opening: normalizeOpeningProgress(rawV2.opening, rawV2.defaultSide)
        };
      }
      if (rawV1 && rawV1.schemaVersion === 1) {
        const defaultSide = isSide(rawV1.side) ? rawV1.side : "T";
        return {
          schemaVersion: 2,
          defaultSide: defaultSide,
          favorites: Array.isArray(rawV1.favorites) ? rawV1.favorites.filter(validLineupId).slice(0, 100) : [],
          notes: normalizeNotes(rawV1.notes),
          recent: Array.isArray(rawV1.recent) ? rawV1.recent.filter(validLineupId).slice(0, 20) : [],
          opening: normalizeOpeningProgress({
            mapId: rawV1.mapId,
            side: rawV1.side,
            spawnId: rawV1.selectedSpawnId,
            objective: rawV1.selectedObjective,
            planId: rawV1.activePlanId,
            stepIndex: rawV1.planStepIndex
          }, defaultSide)
        };
      }
      return structuredCloneSafe(DEFAULT_USER_STATE);
    }

    const CS2LineupsCore = {
      DEMO_MODE: DEMO_MODE,
      STORAGE_KEY: STORAGE_KEY,
      LEGACY_STORAGE_KEY: LEGACY_STORAGE_KEY,
      NADE_LABELS: NADE_LABELS,
      NADE_ORDER: NADE_ORDER,
      FRAME_ORDER: FRAME_ORDER,
      FRAME_LABELS: FRAME_LABELS,
      DEFAULT_USER_STATE: DEFAULT_USER_STATE,
      availableMapIds: availableMapIds,
      getDirectoryEntry: getDirectoryEntry,
      getMapData: getMapData,
      isAvailableMap: isAvailableMap,
      isSide: isSide,
      permittedLineup: permittedLineup,
      permittedPlan: permittedPlan,
      validPoint: validPoint,
      normalizePoint: normalizePoint,
      getZoneById: getZoneById,
      getStationById: getStationById,
      getSpawnById: getSpawnById,
      getLineupById: getLineupById,
      getPlanById: getPlanById,
      findLineupAnywhere: findLineupAnywhere,
      validLineupId: validLineupId,
      findZoneForPoint: findZoneForPoint,
      pointInPolygon: pointInPolygon,
      polygonCenter: polygonCenter,
      distanceSquared: distanceSquared,
      parseRoute: parseRoute,
      serializeRoute: serializeRoute,
      normalizeRoute: normalizeRoute,
      parentRoute: parentRoute,
      queryNearbyLineups: queryNearbyLineups,
      groupLineupsByGrenade: groupLineupsByGrenade,
      resolveOpeningPlan: resolveOpeningPlan,
      getSpawnLineups: getSpawnLineups,
      openingObjectives: openingObjectives,
      techniqueKind: techniqueKind,
      tacticalTitle: tacticalTitle,
      contentStatusLabel: contentStatusLabel,
      frameSource: frameSource,
      nextFrame: nextFrame,
      validateMapData: validateMapData,
      migrateUserState: migrateUserState,
      structuredCloneSafe: structuredCloneSafe
    };
    globalThis.CS2LineupsCore = CS2LineupsCore;

  </script>
  <script id="lineups-app">
    "use strict";
    (function() {
      const Core = globalThis.CS2LineupsCore;
      const elements = {
        backButton: document.getElementById("backButton"),
        screenTitle: document.getElementById("screenTitle"),
        screenActions: document.getElementById("screenActions"),
        screenHost: document.getElementById("screenHost"),
        toast: document.getElementById("toast")
      };

      const dataValidationErrors = Object.keys(MAP_CATALOG).flatMap(function(mapId) {
        return Core.validateMapData(MAP_CATALOG[mapId]).errors.map(function(error) { return mapId + "：" + error; });
      });
      if (dataValidationErrors.length) {
        document.body.replaceChildren();
        const fail = document.createElement("main");
        fail.style.padding = "32px";
        const heading = document.createElement("h1");
        heading.textContent = "内容数据无法载入";
        const copy = document.createElement("p");
        copy.textContent = dataValidationErrors.join("；");
        fail.append(heading, copy);
        document.body.append(fail);
        throw new Error(dataValidationErrors.join("; "));
      }

      let userState = loadUserState();
      let route = Core.normalizeRoute(Core.parseRoute(location.hash));
      let historyIndex = 0;
      let toastTimer = null;
      let locatingTimer = null;
      let locating = false;
      let activeFrame = "aim";
      let showingFar = false;
      let touchStartX = null;
      const viewMemory = new Map();

      function prefersReducedMotion() {
        return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      function currentMapData() {
        return Core.getMapData(route.mapId);
      }

      function viewKey(target) {
        return Core.serializeRoute(target);
      }

      function captureView(target) {
        const active = document.activeElement;
        const restoreId = active && elements.screenHost.contains(active) ? active.getAttribute("data-restore-id") : "";
        viewMemory.set(viewKey(target), {
          scrollTop: elements.screenHost.scrollTop,
          restoreId: restoreId || ""
        });
      }

      function restoreView(target) {
        const memory = viewMemory.get(viewKey(target));
        if (!memory) {
          elements.screenTitle.focus();
          return;
        }
        elements.screenHost.scrollTop = memory.scrollTop || 0;
        if (memory.restoreId) {
          const focusTarget = elements.screenHost.querySelector('[data-restore-id="' + memory.restoreId + '"]');
          if (focusTarget) {
            focusTarget.focus();
            return;
          }
        }
        elements.screenTitle.focus();
      }

      function persistOpeningFromRoute(nextRoute) {
        const openingScreens = ["radar", "opening-objective", "opening-plan", "opening-step", "lineup"];
        if (openingScreens.indexOf(nextRoute.screen) === -1) return;
        if (nextRoute.screen === "radar" && nextRoute.radarMode !== "opening") return;
        userState.opening = {
          mapId: nextRoute.mapId || null,
          side: nextRoute.side || null,
          spawnId: nextRoute.spawnId || null,
          objective: nextRoute.objective || null,
          planId: nextRoute.planId || null,
          stepIndex: nextRoute.stepIndex || 0
        };
        saveUserState(userState);
      }

      function navigate(nextRoute, options) {
        const replace = !!(options && options.replace);
        const normalized = Core.normalizeRoute(nextRoute);
        locating = false;
        window.clearTimeout(locatingTimer);
        if (!replace) captureView(route);
        route = normalized;
        persistOpeningFromRoute(route);
        const url = Core.serializeRoute(route);
        if (replace) {
          history.replaceState({ route: route, index: historyIndex }, "", url);
        } else {
          historyIndex += 1;
          history.pushState({ route: route, index: historyIndex }, "", url);
        }
        renderRoute(route, { restore: false });
      }

      function goBack() {
        if (historyIndex > 0) {
          history.back();
          return;
        }
        navigate(Core.parentRoute(route), { replace: true });
      }

      function chooseMap(mapId) {
        if (!Core.isAvailableMap(mapId)) return;
        navigate({ version: 1, screen: "side", mapId: mapId });
      }

      function chooseSide(side) {
        if (!Core.isSide(side)) return;
        userState.defaultSide = side;
        saveUserState(userState);
        navigate({ version: 1, screen: "radar", mapId: route.mapId, side: side, radarMode: "nearby" });
      }

      function chooseMapPoint(point) {
        const mapData = currentMapData();
        const normalized = Core.normalizePoint(point);
        if (!mapData || !normalized) {
          showToast("请点击地图有效区域");
          return;
        }
        const zone = Core.findZoneForPoint(normalized, mapData.zones);
        if (!zone) {
          showToast("请点击地图有效区域");
          return;
        }
        if (locating) return;
        locating = true;
        drawCurrentPointOnExistingRadar(normalized);
        showToast(zone.label + " · 正在进入附近瞄点");
        locatingTimer = window.setTimeout(function() {
          locating = false;
          navigate({
            version: 1,
            screen: "nearby",
            mapId: route.mapId,
            side: route.side,
            point: normalized
          });
        }, prefersReducedMotion() ? 0 : 200);
      }

      function openLineup(lineupId, extra) {
        extra = extra || {};
        const found = Core.findLineupAnywhere(lineupId);
        const mapId = extra.mapId || route.mapId || (found && found.mapId);
        const mapData = Core.getMapData(mapId);
        const lineup = mapData ? Core.getLineupById(lineupId, mapData) : null;
        if (!Core.permittedLineup(lineup)) return;
        userState.recent = [lineupId].concat(userState.recent.filter(function(id) { return id !== lineupId; })).slice(0, 20);
        saveUserState(userState);
        const next = {
          version: 1,
          screen: "lineup",
          mapId: mapId,
          side: lineup.side,
          lineupId: lineupId
        };
        if (route.point) next.point = route.point;
        if (route.planId) {
          next.planId = route.planId;
          next.stepIndex = route.stepIndex;
          next.spawnId = route.spawnId;
          next.objective = route.objective;
        }
        if (extra.returnTo || route.screen === "favorites") next.returnTo = "favorites";
        activeFrame = "aim";
        navigate(next);
      }

      function openOpeningMode() {
        navigate({
          version: 1,
          screen: "radar",
          mapId: route.mapId,
          side: route.side,
          radarMode: "opening"
        });
      }

      function chooseSpawn(spawnId) {
        const mapData = currentMapData();
        const spawn = mapData ? Core.getSpawnById(spawnId, mapData) : null;
        if (!spawn || spawn.side !== route.side) return;
        navigate({
          version: 1,
          screen: "opening-objective",
          mapId: route.mapId,
          side: route.side,
          spawnId: spawn.id
        });
      }

      function chooseObjective(objective) {
        const mapData = currentMapData();
        const plan = Core.resolveOpeningPlan({
          mapData: mapData,
          side: route.side,
          spawnAnchorId: route.spawnId,
          objective: objective
        });
        if (!plan) {
          navigate({
            version: 1,
            screen: "opening-objective",
            mapId: route.mapId,
            side: route.side,
            spawnId: route.spawnId,
            objective: objective
          });
          showToast("当前身位暂无该目标方案");
          return;
        }
        startPlan(plan.id);
      }

      function startPlan(planId) {
        navigate({
          version: 1,
          screen: "opening-plan",
          mapId: route.mapId,
          side: route.side,
          spawnId: route.spawnId,
          planId: planId
        });
      }

      function completePlanStep() {
        const mapData = currentMapData();
        const plan = mapData ? Core.getPlanById(route.planId, mapData) : null;
        if (!plan) return;
        const nextIndex = Math.min((route.stepIndex || 1) + 1, plan.steps.length + 1);
        navigate({
          version: 1,
          screen: "opening-step",
          mapId: route.mapId,
          side: route.side,
          spawnId: route.spawnId,
          planId: plan.id,
          objective: plan.objective,
          stepIndex: nextIndex
        }, { replace: true });
      }

      function resetRound() {
        userState.opening = Core.structuredCloneSafe(Core.DEFAULT_USER_STATE.opening);
        saveUserState(userState);
        navigate({
          version: 1,
          screen: "radar",
          mapId: route.mapId,
          side: route.side,
          radarMode: "opening"
        }, { replace: true });
        showToast("已开始新回合：出生点和路线进度已清除。");
      }

      function toggleFavorite(lineupId) {
        if (!Core.validLineupId(lineupId)) return;
        if (userState.favorites.indexOf(lineupId) !== -1) {
          userState.favorites = userState.favorites.filter(function(id) { return id !== lineupId; });
          showToast("已取消收藏。");
        } else {
          userState.favorites = [lineupId].concat(userState.favorites).slice(0, 100);
          showToast("已加入本机收藏。");
        }
        saveUserState(userState);
      }

      function saveNote(lineupId, value) {
        const note = String(value || "").trim().slice(0, 500);
        if (note) userState.notes[lineupId] = note;
        else delete userState.notes[lineupId];
        saveUserState(userState);
        showToast(note ? "备注已保存在本机。" : "空备注已清除。");
      }

      function renderRoute(nextRoute, options) {
        showingFar = false;
        locating = false;
        window.clearTimeout(locatingTimer);
        window.clearTimeout(toastTimer);
        elements.toast.classList.remove("is-visible");
        route = Core.normalizeRoute(nextRoute);
        renderHeader(route);
        elements.screenHost.replaceChildren();
        switch (route.screen) {
          case "maps": renderMapsScreen(); break;
          case "side": renderSideScreen(); break;
          case "radar": renderRadarScreen(); break;
          case "nearby": renderNearbyScreen(); break;
          case "lineup": renderLineupScreen(); break;
          case "favorites": renderFavoritesScreen(); break;
          case "opening-objective": renderOpeningObjectiveScreen(); break;
          case "opening-plan": renderOpeningPlanScreen(); break;
          case "opening-step": renderOpeningStepScreen(); break;
          default: renderMapsScreen();
        }
        if (options && options.restore) restoreView(route);
        else elements.screenTitle.focus();
      }

      function renderHeader(current) {
        const mapEntry = current.mapId ? Core.getDirectoryEntry(current.mapId) : null;
        const mapData = current.mapId ? Core.getMapData(current.mapId) : null;
        const mapName = mapEntry ? mapEntry.nameEn : (mapData ? mapData.displayName : "");
        elements.backButton.hidden = current.screen === "maps";
        elements.screenActions.replaceChildren();

        if (current.screen === "maps") {
          elements.screenTitle.textContent = "选择地图";
          elements.screenActions.append(actionButton("收藏", function() {
            navigate({ version: 1, screen: "favorites" });
          }, "favorites"));
          return;
        }
        if (current.screen === "side") {
          elements.screenTitle.textContent = mapEntry.nameZh + " " + mapEntry.nameEn;
          return;
        }
        if (current.screen === "radar") {
          elements.screenTitle.textContent = mapData.displayName;
          elements.screenActions.append(chip(current.side === "T" ? "T 方" : "CT 方"));
          elements.screenActions.append(actionButton("收藏", function() {
            navigate({ version: 1, screen: "favorites" });
          }, "favorites"));
          if (current.radarMode === "opening") {
            elements.screenActions.append(actionButton("新回合", resetRound, "new-round"));
          }
          return;
        }
        if (current.screen === "nearby") {
          const zone = Core.findZoneForPoint(current.point, mapData.zones);
          elements.screenTitle.textContent = mapEntry.nameEn + " · " + (zone ? zone.label + "附近" : "附近瞄点");
          return;
        }
        if (current.screen === "lineup") {
          const lineup = Core.getLineupById(current.lineupId, mapData);
          elements.screenTitle.textContent = Core.tacticalTitle(lineup);
          const favorite = userState.favorites.indexOf(current.lineupId) !== -1;
          const fav = actionButton(favorite ? "已收藏" : "收藏", function() {
            toggleFavorite(current.lineupId);
            renderHeader(route);
          }, "favorite");
          if (favorite) fav.classList.add("is-active");
          elements.screenActions.append(fav);
          return;
        }
        if (current.screen === "favorites") {
          elements.screenTitle.textContent = "本机收藏";
          return;
        }
        elements.screenTitle.textContent = mapData.displayName;
        elements.screenActions.append(chip(current.side === "T" ? "T 方" : "CT 方"));
        elements.screenActions.append(actionButton("新回合", resetRound, "new-round"));
      }

      function chip(text) {
        const span = document.createElement("span");
        span.className = "header-chip";
        span.textContent = text;
        return span;
      }

      function actionButton(label, onClick, restoreId) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "header-action";
        button.textContent = label;
        if (restoreId) button.dataset.restoreId = restoreId;
        button.addEventListener("click", onClick);
        return button;
      }

      function renderMapsScreen() {
        const screen = document.createElement("div");
        screen.className = "screen";
        const grid = document.createElement("div");
        grid.className = "maps-grid";
        MAP_DIRECTORY.forEach(function(entry) {
          const available = entry.status === "available";
          const card = document.createElement("button");
          card.type = "button";
          card.className = "map-card" + (available ? "" : " is-disabled");
          card.dataset.mapId = entry.id;
          card.dataset.restoreId = "map-" + entry.id;
          if (!available) {
            card.disabled = true;
            card.setAttribute("aria-disabled", "true");
          }
          const img = document.createElement("img");
          img.className = "map-thumb";
          img.alt = entry.nameEn + " 地图缩略图";
          img.src = entry.thumbnailDataUri;
          const copy = document.createElement("div");
          copy.className = "map-copy";
          const name = document.createElement("strong");
          name.textContent = entry.nameZh;
          const en = document.createElement("em");
          en.textContent = entry.nameEn;
          const meta = document.createElement("div");
          meta.className = "map-meta";
          const badge = document.createElement("span");
          badge.className = "status-badge" + (available ? "" : " soon");
          badge.textContent = available ? "可用" : "制作中";
          const count = document.createElement("span");
          count.textContent = entry.lineupCount + " 条瞄点";
          meta.append(badge, count);
          copy.append(name, en, meta);
          card.append(img, copy);
          if (available) card.addEventListener("click", function() { chooseMap(entry.id); });
          grid.append(card);
        });
        screen.append(grid);
        elements.screenHost.append(screen);
      }

      function renderSideScreen() {
        const entry = Core.getDirectoryEntry(route.mapId);
        const screen = document.createElement("div");
        screen.className = "screen";
        const grid = document.createElement("div");
        grid.className = "side-grid";
        [
          { id: "T", title: "T 方", copy: "Terrorist · 进攻方" },
          { id: "CT", title: "CT 方", copy: "Counter-Terrorist · 防守方" }
        ].forEach(function(item) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "side-card";
          button.dataset.side = item.id;
          button.dataset.restoreId = "side-" + item.id;
          const title = document.createElement("strong");
          title.textContent = item.title;
          const copy = document.createElement("span");
          copy.textContent = item.copy + " · " + entry.nameEn;
          button.append(title, copy);
          button.addEventListener("click", function() { chooseSide(item.id); });
          grid.append(button);
        });
        screen.append(grid);
        elements.screenHost.append(screen);
      }

      function renderRadarScreen() {
        const nearby = route.radarMode !== "opening";
        const shell = document.createElement("div");
        shell.className = "radar-shell" + (nearby ? "" : " is-opening");
        const modeBar = document.createElement("div");
        modeBar.className = "mode-bar";
        modeBar.append(
          modeButton("附近瞄点", "nearby", nearby),
          modeButton("开局路线", "opening", !nearby)
        );
        const stage = document.createElement("div");
        stage.className = "radar-stage";
        const overlay = document.createElement("div");
        overlay.className = "map-overlay-head";
        const strong = document.createElement("strong");
        strong.id = "mapInstruction";
        strong.textContent = nearby ? "点击你现在的位置" : "点击出生圆点，确认本回合物理身位";
        const span = document.createElement("span");
        span.textContent = nearby
          ? "只使用你的手动点击；不读取游戏、屏幕、日志或配置。"
          : "编号只属于本原型；第一视角示意和雷达位置共同确认。";
        overlay.append(strong, span);
        const radar = createRadarSvg(currentMapData());
        radar.style.cursor = nearby ? "crosshair" : "default";
        radar.addEventListener("click", function(event) {
          if (!nearby) {
            showToast("请点击出生圆点");
            return;
          }
          const point = clientPointToRadar(radar, event.clientX, event.clientY);
          chooseMapPoint(point);
        });
        stage.append(overlay, radar);
        shell.append(modeBar, stage);
        elements.screenHost.append(shell);
        if (nearby) renderRadarZones(radar, currentMapData());
        else renderOpeningRadar(radar, currentMapData());
      }

      function modeButton(label, mode, active) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "mode-button" + (active ? " is-active" : "");
        button.textContent = label;
        button.dataset.restoreId = "mode-" + mode;
        button.addEventListener("click", function() {
          if (mode === "opening") openOpeningMode();
          else navigate({ version: 1, screen: "radar", mapId: route.mapId, side: route.side, radarMode: "nearby" });
        });
        return button;
      }

      function createRadarSvg(mapData) {
        const svg = makeSvg("svg");
        svg.id = "radar";
        svg.setAttribute("viewBox", "0 0 1000 1000");
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", mapData.displayName + " 官方游戏雷达");
        const defs = makeSvg("defs");
        defs.innerHTML =
          '<filter id="markerGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>' +
          '<marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e97945"></path></marker>';
        const image = makeSvg("image");
        image.id = "radarImage";
        image.setAttribute("href", mapData.radarDataUri);
        image.setAttribute("x", "0");
        image.setAttribute("y", "0");
        image.setAttribute("width", "1000");
        image.setAttribute("height", "1000");
        image.setAttribute("preserveAspectRatio", "xMidYMid meet");
        const zoneLayer = makeSvg("g");
        zoneLayer.id = "zoneLayer";
        const routeLayer = makeSvg("g");
        routeLayer.id = "routeLayer";
        const dynamicLayer = makeSvg("g");
        dynamicLayer.id = "dynamicLayer";
        svg.append(defs, image, zoneLayer, routeLayer, dynamicLayer);
        return svg;
      }

      function renderRadarZones(radar, mapData) {
        const zoneLayer = radar.querySelector("#zoneLayer");
        mapData.zones.forEach(function(zone) {
          const polygon = makeSvg("polygon");
          polygon.setAttribute("points", zone.polygon.map(function(point) { return point.join(","); }).join(" "));
          polygon.setAttribute("class", "zone-shape");
          polygon.dataset.zoneId = zone.id;
          zoneLayer.append(polygon);
        });
      }

      function renderOpeningRadar(radar, mapData) {
        renderRadarZones(radar, mapData);
        const dynamicLayer = radar.querySelector("#dynamicLayer");
        mapData.spawnAnchors.filter(function(spawn) { return spawn.side === route.side; }).forEach(function(spawn, index) {
          const marker = makeSvg("g");
          marker.setAttribute("class", "spawn-marker");
          marker.setAttribute("role", "button");
          marker.setAttribute("tabindex", "0");
          marker.setAttribute("aria-label", spawn.displayCode + " " + spawn.landmarkLabel);
          marker.dataset.restoreId = "spawn-" + spawn.id;
          const halo = makeSvg("circle");
          halo.setAttribute("cx", spawn.point.x);
          halo.setAttribute("cy", spawn.point.y);
          halo.setAttribute("r", "28");
          halo.setAttribute("class", "marker-halo");
          const core = makeSvg("circle");
          core.setAttribute("cx", spawn.point.x);
          core.setAttribute("cy", spawn.point.y);
          core.setAttribute("r", "17");
          core.setAttribute("class", "marker-core");
          const text = makeSvg("text");
          text.setAttribute("x", spawn.point.x);
          text.setAttribute("y", spawn.point.y + 4);
          text.textContent = String(index + 1);
          marker.append(halo, core, text);
          const activate = function(event) {
            event.stopPropagation();
            chooseSpawn(spawn.id);
          };
          marker.addEventListener("click", activate);
          marker.addEventListener("keydown", function(event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              activate(event);
            }
          });
          dynamicLayer.append(marker);
        });
      }

      function drawCurrentPointOnExistingRadar(point) {
        const radar = document.getElementById("radar");
        if (!radar) return;
        const layer = radar.querySelector("#dynamicLayer");
        layer.replaceChildren();
        const group = makeSvg("g");
        group.setAttribute("filter", "url(#markerGlow)");
        const ring = makeSvg("circle");
        ring.setAttribute("cx", point.x);
        ring.setAttribute("cy", point.y);
        ring.setAttribute("r", "44");
        ring.setAttribute("class", "current-ring");
        const dot = makeSvg("circle");
        dot.setAttribute("cx", point.x);
        dot.setAttribute("cy", point.y);
        dot.setAttribute("r", "11");
        dot.setAttribute("class", "current-dot");
        group.append(ring, dot);
        layer.append(group);
        const mapData = currentMapData();
        const zone = Core.findZoneForPoint(point, mapData.zones);
        if (zone) {
          const current = radar.querySelector('[data-zone-id="' + zone.id + '"]');
          if (current) current.classList.add("is-current");
        }
      }

      function clientPointToRadar(radar, clientX, clientY) {
        const point = radar.createSVGPoint();
        point.x = clientX;
        point.y = clientY;
        const matrix = radar.getScreenCTM();
        return matrix ? point.matrixTransform(matrix.inverse()) : { x: 500, y: 500 };
      }

      function renderNearbyScreen() {
        const mapData = currentMapData();
        const result = Core.queryNearbyLineups({ mapData: mapData, side: route.side, point: route.point });
        const screen = document.createElement("div");
        screen.className = "screen";
        screen.append(locationSummary(mapData, result.zone, route.point));
        const host = document.createElement("div");
        host.id = "nearbyResults";
        screen.append(host);
        elements.screenHost.append(screen);
        renderNearbyList(host, result, false);
      }

      function locationSummary(mapData, zone, point) {
        const wrap = document.createElement("div");
        wrap.className = "location-summary";
        const mini = document.createElement("div");
        mini.className = "mini-radar";
        mini.append(createMiniRadar(mapData, point, zone));
        const copy = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = zone ? zone.label : "未知区域";
        const meta = document.createElement("span");
        meta.textContent = mapData.displayName + " · " + route.side + " · " + point.x + " / " + point.y;
        copy.append(title, meta);
        wrap.append(mini, copy);
        return wrap;
      }

      function createMiniRadar(mapData, point, zone) {
        const svg = makeSvg("svg");
        svg.setAttribute("viewBox", "0 0 1000 1000");
        svg.setAttribute("aria-hidden", "true");
        const image = makeSvg("image");
        image.setAttribute("href", mapData.radarDataUri);
        image.setAttribute("width", "1000");
        image.setAttribute("height", "1000");
        const dot = makeSvg("circle");
        dot.setAttribute("cx", point.x);
        dot.setAttribute("cy", point.y);
        dot.setAttribute("r", "22");
        dot.setAttribute("class", "current-dot");
        svg.append(image, dot);
        if (zone) {
          const polygon = makeSvg("polygon");
          polygon.setAttribute("points", zone.polygon.map(function(item) { return item.join(","); }).join(" "));
          polygon.setAttribute("class", "zone-shape is-current");
          svg.insertBefore(polygon, dot);
        }
        return svg;
      }

      function renderNearbyList(host, result, far) {
        const entries = far ? result.far : result.nearby;
        host.replaceChildren();
        if (!entries.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const title = document.createElement("strong");
          title.textContent = far ? "较远位置也没有瞄点" : "当前位置附近暂无瞄点";
          const copy = document.createElement("p");
          copy.textContent = far
            ? "演示目录不会把不可靠近似结果混入附近列表。"
            : "附近列表只包含当前区域与相邻通路，不会自动混入较远瞄点。";
          const actions = document.createElement("div");
          actions.className = "empty-actions";
          const retry = document.createElement("button");
          retry.type = "button";
          retry.className = "secondary-button";
          retry.textContent = "重新选点";
          retry.dataset.restoreId = "reselect-point";
          retry.addEventListener("click", goBack);
          actions.append(retry);
          if (!far && result.far.length) {
            const farther = document.createElement("button");
            farther.type = "button";
            farther.className = "primary-button";
            farther.textContent = "查看较远瞄点";
            farther.dataset.restoreId = "show-far";
            farther.addEventListener("click", function() {
              showingFar = true;
              renderNearbyList(host, result, true);
            });
            actions.append(farther);
          }
          empty.append(title, copy, actions);
          host.append(empty);
          return;
        }
        Core.groupLineupsByGrenade(entries).forEach(function(group) {
          const section = document.createElement("section");
          section.className = "nade-section";
          const heading = document.createElement("h2");
          heading.textContent = group.label + " · " + group.entries.length;
          section.append(heading);
          group.entries.forEach(function(item) {
            section.append(createLineupCard(item));
          });
          host.append(section);
        });
      }

      function createLineupCard(item) {
        const lineup = item.lineup;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "lineup-card";
        button.dataset.lineupId = lineup.id;
        button.dataset.restoreId = "lineup-" + lineup.id;
        const icon = document.createElement("span");
        icon.className = "nade-icon " + lineup.grenadeType;
        icon.textContent = Core.NADE_LABELS[lineup.grenadeType];
        const main = document.createElement("span");
        main.className = "lineup-main";
        const title = document.createElement("strong");
        title.textContent = Core.tacticalTitle(lineup);
        const path = document.createElement("span");
        path.textContent = item.station.label + " → " + lineup.targetLabel;
        main.append(title, path);
        const flags = document.createElement("span");
        flags.className = "lineup-flags";
        const technique = document.createElement("span");
        technique.textContent = Core.techniqueKind(lineup);
        const status = document.createElement("span");
        status.textContent = lineup.side + " · " + Core.contentStatusLabel(lineup);
        const fav = document.createElement("span");
        fav.textContent = userState.favorites.indexOf(lineup.id) !== -1 ? "★ 已收藏" : "☆";
        flags.append(technique, status, fav);
        button.append(icon, main, flags);
        button.addEventListener("click", function() {
          const found = Core.findLineupAnywhere(lineup.id);
          openLineup(lineup.id, {
            mapId: found && found.mapId,
            returnTo: route.screen === "favorites" ? "favorites" : undefined
          });
        });
        return button;
      }

      function renderLineupScreen() {
        const mapData = currentMapData();
        const lineup = Core.getLineupById(route.lineupId, mapData);
        const station = Core.getStationById(lineup.startStationId, mapData);
        const screen = document.createElement("div");
        screen.className = "screen-lineup";
        screen.append(renderDetailStage(lineup));
        const body = document.createElement("div");
        body.className = "detail-body";
        const meta = document.createElement("div");
        meta.className = "detail-meta";
        [
          lineup.side,
          Core.NADE_LABELS[lineup.grenadeType],
          Core.techniqueKind(lineup),
          station.label + " → " + lineup.targetLabel,
          Core.contentStatusLabel(lineup)
        ].forEach(function(text) {
          const chipEl = document.createElement("span");
          chipEl.className = "meta-chip" + (lineup.status === "demo" ? " demo" : "");
          chipEl.textContent = text;
          meta.append(chipEl);
        });
        const grid = document.createElement("div");
        grid.className = "detail-grid";
        grid.append(detailBlock("投掷方式", lineup.technique), detailBlock("战术用途", lineup.purpose));
        const label = document.createElement("label");
        label.className = "note-label";
        label.setAttribute("for", "noteBox");
        label.textContent = "我的备注（只保存在本机）";
        const note = document.createElement("textarea");
        note.id = "noteBox";
        note.className = "note-box";
        note.maxLength = 500;
        note.placeholder = "例如：准星再靠左半格；只适合满甲长枪局。";
        note.value = userState.notes[lineup.id] || "";
        const actions = document.createElement("div");
        actions.className = "detail-actions";
        const save = document.createElement("button");
        save.type = "button";
        save.className = "primary-button";
        save.textContent = "保存备注";
        save.addEventListener("click", function() { saveNote(lineup.id, note.value); });
        actions.append(save);
        body.append(meta, grid, label, note, actions);
        screen.append(body);
        elements.screenHost.append(screen);
      }

      function renderDetailStage(lineup) {
        const stage = document.createElement("div");
        stage.className = "detail-stage";
        const prev = document.createElement("button");
        prev.type = "button";
        prev.className = "media-nav";
        prev.setAttribute("aria-label", "上一张图");
        prev.textContent = "‹";
        prev.addEventListener("click", function() { shiftFrame(-1); });
        const next = document.createElement("button");
        next.type = "button";
        next.className = "media-nav";
        next.setAttribute("aria-label", "下一张图");
        next.textContent = "›";
        next.addEventListener("click", function() { shiftFrame(1); });
        const media = document.createElement("div");
        media.className = "detail-media";
        media.id = "detailMedia";
        fillDetailMedia(media, lineup, activeFrame);
        media.addEventListener("touchstart", function(event) {
          touchStartX = event.changedTouches[0].clientX;
        }, { passive: true });
        media.addEventListener("touchend", function(event) {
          if (touchStartX == null) return;
          const dx = event.changedTouches[0].clientX - touchStartX;
          touchStartX = null;
          if (Math.abs(dx) < 40) return;
          shiftFrame(dx < 0 ? 1 : -1);
        });
        stage.append(prev, media, next);
        return stage;
      }

      function fillDetailMedia(media, lineup, frame) {
        media.replaceChildren();
        media.dataset.frame = frame;
        const src = Core.frameSource(lineup, frame);
        if (src) {
          const img = document.createElement("img");
          img.alt = Core.FRAME_LABELS[frame];
          img.src = src;
          media.append(img);
        } else {
          const missing = document.createElement("div");
          missing.className = "media-missing";
          missing.textContent = "素材未提供";
          media.append(missing);
        }
        const label = document.createElement("span");
        label.className = "media-label";
        label.textContent = Core.FRAME_LABELS[frame];
        media.append(label);
      }

      function shiftFrame(direction) {
        if (route.screen !== "lineup") return;
        const next = Core.nextFrame(activeFrame, direction);
        if (next === activeFrame) return;
        activeFrame = next;
        const media = document.getElementById("detailMedia");
        const mapData = currentMapData();
        const lineup = mapData ? Core.getLineupById(route.lineupId, mapData) : null;
        if (media && lineup) fillDetailMedia(media, lineup, activeFrame);
      }

      function detailBlock(title, copy) {
        const block = document.createElement("div");
        block.className = "detail-block";
        const strong = document.createElement("strong");
        strong.textContent = title;
        const p = document.createElement("p");
        p.textContent = copy;
        block.append(strong, p);
        return block;
      }

      function renderFavoritesScreen() {
        const screen = document.createElement("div");
        screen.className = "screen";
        const host = document.createElement("div");
        const entries = userState.favorites.map(function(id) {
          const found = Core.findLineupAnywhere(id);
          if (!found) return null;
          return {
            lineup: found.lineup,
            station: Core.getStationById(found.lineup.startStationId, found.mapData),
            zone: Core.getZoneById(Core.getStationById(found.lineup.startStationId, found.mapData).zoneId, found.mapData),
            proximity: "current",
            distance: 0,
            mapId: found.mapId
          };
        }).filter(Boolean);
        if (!entries.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const title = document.createElement("strong");
          title.textContent = "还没有收藏";
          const copy = document.createElement("p");
          copy.textContent = "收藏只保存在本机，不会随页面刷新丢失。";
          empty.append(title, copy);
          host.append(empty);
        } else {
          entries.forEach(function(item) {
            const card = createLineupCard(item);
            card.dataset.restoreId = "fav-" + item.lineup.id;
            host.append(card);
          });
        }
        screen.append(host);
        elements.screenHost.append(screen);
      }

      function renderOpeningObjectiveScreen() {
        const mapData = currentMapData();
        const spawn = Core.getSpawnById(route.spawnId, mapData);
        const screen = document.createElement("div");
        screen.className = "screen";
        const intro = document.createElement("p");
        intro.textContent = spawn.displayCode + " " + spawn.landmarkLabel + " · 选择本回合目标";
        const grid = document.createElement("div");
        grid.className = "objective-grid";
        Core.openingObjectives(route.side).forEach(function(objective) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "objective-button" + (objective.id === route.objective ? " is-active" : "");
          button.dataset.restoreId = "objective-" + objective.id;
          const title = document.createElement("strong");
          title.textContent = objective.label;
          const copy = document.createElement("span");
          copy.textContent = objective.detail;
          button.append(title, copy);
          button.addEventListener("click", function() { chooseObjective(objective.id); });
          grid.append(button);
        });
        screen.append(intro, grid);
        if (route.objective && !Core.resolveOpeningPlan({
          mapData: mapData,
          side: route.side,
          spawnAnchorId: route.spawnId,
          objective: route.objective
        })) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const title = document.createElement("strong");
          title.textContent = "当前身位暂无该目标方案";
          const copy = document.createElement("p");
          copy.textContent = "返回附近瞄点查看单颗道具；应用不会临时拼接未经编排的战术。";
          empty.append(title, copy);
          screen.append(empty);
        }
        elements.screenHost.append(screen);
      }

      function renderOpeningPlanScreen() {
        const mapData = currentMapData();
        const plan = Core.getPlanById(route.planId, mapData);
        const spawn = route.spawnId ? Core.getSpawnById(route.spawnId, mapData) : null;
        const screen = document.createElement("div");
        screen.className = "screen";
        const card = document.createElement("article");
        card.className = "plan-card";
        const head = document.createElement("div");
        head.className = "plan-head";
        const code = document.createElement("div");
        code.className = "eyebrow";
        code.textContent = plan.id.toUpperCase() + " · DEMO";
        const title = document.createElement("h2");
        title.textContent = plan.title;
        const summary = document.createElement("p");
        summary.textContent = plan.summary + (spawn && plan.variantNotes[spawn.id] ? " " + plan.variantNotes[spawn.id] : "");
        const loadout = document.createElement("div");
        loadout.className = "loadout";
        plan.requiredLoadout.forEach(function(item) {
          const chipEl = document.createElement("span");
          chipEl.textContent = item;
          loadout.append(chipEl);
        });
        head.append(code, title, summary, loadout);
        const steps = document.createElement("div");
        steps.className = "plan-steps";
        plan.steps.forEach(function(step, index) {
          const row = document.createElement("div");
          row.className = "plan-step";
          const strong = document.createElement("strong");
          strong.textContent = (index + 1) + ". " + step.title;
          const detail = document.createElement("span");
          detail.textContent = step.instruction;
          row.append(strong, detail);
          steps.append(row);
        });
        const actions = document.createElement("div");
        actions.className = "plan-actions";
        const start = document.createElement("button");
        start.type = "button";
        start.className = "primary-button";
        start.textContent = "开始手动路线";
        start.dataset.restoreId = "start-plan";
        start.addEventListener("click", function() {
          navigate({
            version: 1,
            screen: "opening-step",
            mapId: route.mapId,
            side: route.side,
            spawnId: route.spawnId,
            planId: plan.id,
            objective: plan.objective,
            stepIndex: 1
          });
        });
        actions.append(start);
        card.append(head, steps, actions);
        screen.append(card);
        elements.screenHost.append(screen);
      }

      function renderOpeningStepScreen() {
        const mapData = currentMapData();
        const plan = Core.getPlanById(route.planId, mapData);
        const screen = document.createElement("div");
        screen.className = "screen";
        const wrap = document.createElement("div");
        wrap.className = "stepper";
        if (route.stepIndex > plan.steps.length) {
          const meta = document.createElement("div");
          meta.className = "eyebrow";
          meta.textContent = "ROUTE COMPLETE · " + plan.endLocationLabel;
          const title = document.createElement("h2");
          title.textContent = "路线步骤已查看完";
          const copy = document.createElement("p");
          copy.textContent = "这只代表你手动推进了笔记步骤，应用不知道游戏内是否实际完成。下一回合请重新选择出生点。";
          const reset = document.createElement("button");
          reset.type = "button";
          reset.className = "primary-button";
          reset.textContent = "结束并准备新回合";
          reset.addEventListener("click", resetRound);
          wrap.append(meta, title, copy, reset);
          screen.append(wrap);
          elements.screenHost.append(screen);
          return;
        }
        const step = plan.steps[route.stepIndex - 1];
        const meta = document.createElement("div");
        meta.className = "eyebrow";
        meta.textContent = "STEP " + route.stepIndex + " / " + plan.steps.length + " · " + plan.difficulty;
        const track = document.createElement("div");
        track.className = "progress-track";
        const fill = document.createElement("i");
        fill.style.width = Math.round((route.stepIndex / plan.steps.length) * 100) + "%";
        track.append(fill);
        const title = document.createElement("h2");
        title.textContent = step.title;
        const copy = document.createElement("p");
        copy.textContent = step.instruction;
        const actions = document.createElement("div");
        actions.className = "stepper-actions";
        if (step.type === "throw") {
          const view = document.createElement("button");
          view.type = "button";
          view.className = "secondary-button";
          view.textContent = "查看瞄点";
          view.dataset.restoreId = "view-step-lineup";
          view.addEventListener("click", function() { openLineup(step.lineupId); });
          actions.append(view);
        }
        const next = document.createElement("button");
        next.type = "button";
        next.className = "primary-button";
        next.textContent = route.stepIndex === plan.steps.length ? "已完成，结束路线" : "已完成，下一步";
        next.dataset.restoreId = "complete-step";
        next.addEventListener("click", completePlanStep);
        actions.append(next);
        wrap.append(meta, track, title, copy, actions);
        screen.append(wrap);
        elements.screenHost.append(screen);
      }

      function makeSvg(name) {
        return document.createElementNS(SVG_NS, name);
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.add("is-visible");
        toastTimer = window.setTimeout(function() {
          elements.toast.classList.remove("is-visible");
        }, 2200);
      }

      function loadUserState() {
        let rawV2 = null;
        let rawV1 = null;
        try { rawV2 = JSON.parse(localStorage.getItem(Core.STORAGE_KEY) || "null"); } catch (error) { rawV2 = null; }
        try { rawV1 = JSON.parse(localStorage.getItem(Core.LEGACY_STORAGE_KEY) || "null"); } catch (error) { rawV1 = null; }
        return Core.migrateUserState(rawV2, rawV1);
      }

      function saveUserState(nextState) {
        try {
          localStorage.setItem(Core.STORAGE_KEY, JSON.stringify(nextState));
        } catch (error) {
          showToast("浏览器未允许本机存储；收藏和进度只保留到本次关闭。");
        }
      }

      function boot() {
        const hash = location.hash;
        if (!hash || hash === "#" || hash === "#/") {
          route = { version: 1, screen: "maps" };
          history.replaceState({ route: route, index: 0 }, "", "#/maps");
        } else {
          const parsed = Core.parseRoute(hash);
          const fromState = history.state && history.state.route;
          route = Core.normalizeRoute(fromState && Core.serializeRoute(fromState).split("/").slice(0, 3).join("/") === Core.serializeRoute(parsed).split("/").slice(0, 3).join("/")
            ? Object.assign({}, parsed, fromState)
            : parsed);
          history.replaceState({ route: route, index: 0 }, "", Core.serializeRoute(route));
        }
        historyIndex = 0;
        renderRoute(route, { restore: false });
      }

      elements.backButton.addEventListener("click", goBack);
      window.addEventListener("popstate", function(event) {
        const fromState = event.state && event.state.route;
        const parsed = Core.parseRoute(location.hash);
        route = Core.normalizeRoute(fromState ? Object.assign({}, parsed, fromState) : parsed);
        historyIndex = event.state && Number.isInteger(event.state.index) ? event.state.index : 0;
        renderRoute(route, { restore: true });
      });
      window.addEventListener("keydown", function(event) {
        if (route.screen !== "lineup") return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          shiftFrame(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          shiftFrame(1);
        }
      });

      globalThis.CS2LineupsApp = {
        navigate: navigate,
        goBack: goBack,
        parseRoute: Core.parseRoute,
        serializeRoute: Core.serializeRoute,
        normalizeRoute: Core.normalizeRoute,
        parentRoute: Core.parentRoute,
        renderRoute: renderRoute,
        chooseMap: chooseMap,
        chooseSide: chooseSide,
        chooseMapPoint: chooseMapPoint,
        openLineup: openLineup,
        openOpeningMode: openOpeningMode,
        chooseSpawn: chooseSpawn,
        chooseObjective: chooseObjective,
        startPlan: startPlan,
        completePlanStep: completePlanStep,
        resetRound: resetRound
      };

      boot();
    })();

  </script>
</body>
</html>
