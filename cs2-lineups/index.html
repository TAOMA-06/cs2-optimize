<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1415">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CS2 道具地图 — 随身瞄点笔记</title>
  <style>
    :root {
      --ink: #0f1415;
      --ink-2: #141b1d;
      --panel: #192123;
      --panel-2: #202a2c;
      --panel-3: #263234;
      --line: #354345;
      --line-soft: rgba(202, 214, 205, 0.13);
      --paper: #e9e1cd;
      --paper-dim: #b9b49f;
      --muted: #899597;
      --signal: #e97945;
      --signal-soft: rgba(233, 121, 69, 0.16);
      --aqua: #75bfc0;
      --aqua-soft: rgba(117, 191, 192, 0.15);
      --moss: #91a078;
      --danger: #d75f59;
      --smoke: #9eb0b1;
      --flash: #e4c76b;
      --fire: #e97945;
      --he: #91a078;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      --display: "Arial Narrow", "Avenir Next Condensed", "Segoe UI", sans-serif;
      --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      --header-h: 56px;
      --banner-h: 34px;
    }

    * { box-sizing: border-box; }
    html { background: var(--ink); }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 78% 12%, rgba(117, 191, 192, 0.07), transparent 25rem),
        linear-gradient(135deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        var(--ink);
      background-size: auto, 22px 22px, auto;
      color: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [role="button"]:focus-visible, a:focus-visible {
      outline: 2px solid var(--aqua);
      outline-offset: 3px;
    }
    .skip-link {
      position: fixed;
      left: 12px;
      top: -60px;
      z-index: 1000;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }
    .skip-link:focus { top: 12px; }
    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: var(--header-h) var(--banner-h) minmax(0, 1fr);
    }
    .nav-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: var(--header-h);
      padding: 6px 12px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(15, 20, 21, 0.94);
      backdrop-filter: blur(18px);
    }
    #backButton, .icon-button, .header-chip, .header-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--paper);
      cursor: pointer;
    }
    #backButton[hidden] { visibility: hidden; }
    #backButton:hover, .icon-button:hover, .header-action:hover { border-color: var(--aqua); }
    #screenTitle {
      margin: 0;
      min-width: 0;
      font-family: var(--display);
      font-size: clamp(18px, 4vw, 28px);
      font-weight: 680;
      letter-spacing: -0.02em;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #screenActions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .header-chip {
      cursor: default;
      color: var(--aqua);
      border-color: rgba(117, 191, 192, 0.45);
      background: var(--aqua-soft);
      font: 12px var(--mono);
    }
    .header-action.is-active { color: var(--flash); border-color: var(--flash); }
    .demo-boundary {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: var(--banner-h);
      padding: 6px 16px;
      border-bottom: 1px solid rgba(233, 121, 69, 0.3);
      background: rgba(233, 121, 69, 0.09);
      color: #f0b18f;
      font-size: 12px;
      text-align: center;
    }
    #screenHost {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      outline: none;
    }
    .screen {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px clamp(14px, 3vw, 32px) 32px;
    }
    .screen-radar, .screen-lineup {
      width: 100%;
      max-width: none;
      padding: 0;
    }
    .eyebrow {
      color: var(--aqua);
      font: 11px/1.2 var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .maps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 8px;
    }
    .map-card {
      display: flex;
      flex-direction: column;
      min-height: 44px;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      background: rgba(20, 27, 29, 0.9);
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
    }
    .map-card:hover { border-color: var(--aqua); transform: translateY(-1px); }
    .map-card:disabled, .map-card.is-disabled {
      cursor: not-allowed;
      opacity: 0.72;
      transform: none;
      filter: saturate(0.65);
    }
    .map-card:disabled:hover, .map-card.is-disabled:hover { border-color: var(--line-soft); }
    .map-thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #111718;
    }
    .map-copy { padding: 12px 14px 14px; }
    .map-copy strong { display: block; font-size: 17px; }
    .map-copy em {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font: 12px var(--mono);
      font-style: normal;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .map-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      color: var(--paper-dim);
      font-size: 12px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--aqua-soft);
      color: var(--aqua);
      font: 10px var(--mono);
    }
    .status-badge.soon {
      background: rgba(233, 121, 69, 0.12);
      color: #f0b18f;
    }
    .side-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .side-card {
      min-height: 220px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(117, 191, 192, 0.08), rgba(20, 27, 29, 0.92));
      text-align: left;
      cursor: pointer;
    }
    .side-card[data-side="T"] { background: linear-gradient(160deg, rgba(233, 121, 69, 0.14), rgba(20, 27, 29, 0.92)); }
    .side-card strong { display: block; font-family: var(--display); font-size: clamp(36px, 8vw, 64px); line-height: 0.95; }
    .side-card span { display: block; margin-top: 10px; color: var(--muted); font-size: 14px; }
    .side-card:hover { border-color: var(--paper); }
    .radar-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: calc(100dvh - var(--header-h) - var(--banner-h));
    }
    .mode-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--panel);
    }
    .mode-button {
      flex: 1;
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-button.is-active {
      color: var(--paper);
      border-color: var(--line);
      background: var(--panel-3);
      box-shadow: inset 0 -2px 0 var(--signal);
    }
    .radar-stage {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(117, 191, 192, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(117, 191, 192, 0.035) 1px, transparent 1px),
        #111718;
      background-size: 40px 40px;
      overflow: hidden;
    }
    .map-overlay-head {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 4;
      max-width: min(430px, calc(100% - 24px));
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(15, 20, 21, 0.82);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }
    .map-overlay-head strong { display: block; font-size: 13px; }
    .map-overlay-head span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    #radar {
      display: block;
      width: min(100%, calc(100dvh - var(--header-h) - var(--banner-h) - 60px));
      height: auto;
      max-height: calc(100dvh - var(--header-h) - var(--banner-h) - 12px);
      aspect-ratio: 1;
      cursor: crosshair;
      touch-action: manipulation;
    }
    .radar-shell.is-opening #radar { cursor: default; }
    #radarImage { pointer-events: none; opacity: 0.92; }
    .zone-shape { fill: transparent; stroke: transparent; stroke-width: 3; }
    .zone-shape.is-current { fill: rgba(233, 121, 69, 0.16); stroke: var(--signal); }
    .zone-shape.is-neighbor { fill: rgba(117, 191, 192, 0.09); stroke: rgba(117, 191, 192, 0.48); }
    .zone-label { display: none; }
    .station-marker, .spawn-marker { cursor: pointer; }
    .station-marker .marker-halo { fill: rgba(117, 191, 192, 0.16); stroke: rgba(117, 191, 192, 0.56); stroke-width: 2; }
    .station-marker .marker-core { fill: var(--aqua); }
    .spawn-marker .marker-halo { fill: rgba(233, 121, 69, 0.17); stroke: var(--signal); stroke-width: 2; }
    .spawn-marker .marker-core { fill: var(--signal); }
    .spawn-marker.is-selected .marker-halo { stroke: var(--paper); stroke-width: 5; }
    .station-marker text, .spawn-marker text {
      fill: var(--ink);
      font: 700 13px var(--mono);
      text-anchor: middle;
      pointer-events: none;
    }
    .route-line { fill: none; stroke: var(--signal); stroke-width: 6; stroke-dasharray: 12 10; opacity: 0.85; marker-end: url(#arrowHead); }
    .current-ring { fill: none; stroke: var(--signal); stroke-width: 4; transform-origin: center; animation: locatePulse 1.8s ease-out infinite; }
    .current-dot { fill: var(--signal); stroke: var(--paper); stroke-width: 3; }
    @keyframes locatePulse { from { opacity: 0.9; transform: scale(0.55); } to { opacity: 0; transform: scale(1.35); } }
    .location-summary span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .location-summary {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
    }
    .mini-radar {
      width: 92px;
      height: 92px;
      border-radius: 10px;
      background: #111718;
      overflow: hidden;
      pointer-events: none;
    }
    .mini-radar svg { display: block; width: 100%; height: 100%; }
    .nade-section { margin-bottom: 18px; }
    .nade-section h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 14px;
    }
    .lineup-card {
      width: 100%;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 72px;
      margin-bottom: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      text-align: left;
      cursor: pointer;
    }
    .lineup-card:hover { background: var(--panel-2); }
    .nade-icon {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font: 700 12px var(--mono);
    }
    .nade-icon.smoke { color: var(--smoke); }
    .nade-icon.flash { color: var(--flash); }
    .nade-icon.molotov { color: var(--fire); }
    .nade-icon.he { color: var(--he); }
    .lineup-main { min-width: 0; }
    .lineup-main strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .lineup-main span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lineup-flags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: var(--paper-dim); font: 10px var(--mono); }
    .empty-state {
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 28px 16px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state strong { display: block; color: var(--paper); font-size: 16px; }
    .empty-state p { margin: 8px 0 16px; max-width: 280px; font-size: 13px; line-height: 1.55; }
    .empty-actions, .plan-actions, .detail-actions, .stepper-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .primary-button, .secondary-button {
      min-height: 44px;
      min-width: 44px;
      border-radius: 9px;
      padding: 9px 14px;
      cursor: pointer;
    }
    .primary-button { border: 1px solid var(--signal); background: var(--signal); color: #17110d; font-weight: 700; }
    .secondary-button { border: 1px solid var(--line); background: var(--panel-2); color: var(--paper); }
    .screen-lineup .detail-stage {
      position: relative;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: stretch;
      min-height: min(62vh, 720px);
      background: #101617;
    }
    .detail-media {
      position: relative;
      min-height: min(62vh, 720px);
      display: grid;
      place-items: center;
      overflow: hidden;
      touch-action: pan-y;
    }
    .detail-media img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: min(62vh, 720px);
      object-fit: contain;
    }
    .media-missing {
      display: grid;
      place-items: center;
      width: min(92%, 640px);
      min-height: 220px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--paper);
      font-size: 18px;
      letter-spacing: 0.04em;
    }
    .media-label {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(15, 20, 21, 0.82);
      color: var(--paper-dim);
      font: 10px var(--mono);
    }
    .media-nav {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      background: rgba(15, 20, 21, 0.35);
      font-size: 28px;
      cursor: pointer;
    }
    .detail-body { width: min(920px, 100%); margin: 0 auto; padding: 16px clamp(14px, 3vw, 28px) 32px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .detail-block { padding: 13px; border: 1px solid var(--line-soft); border-radius: 10px; background: rgba(255,255,255,0.02); }
    .detail-block strong { display: block; margin-bottom: 6px; font-size: 12px; }
    .detail-block p { margin: 0; color: var(--paper-dim); font-size: 13px; line-height: 1.55; }
    .note-label { display: block; margin: 15px 0 6px; color: var(--paper-dim); font-size: 12px; }
    .note-box {
      width: 100%;
      min-height: 78px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--ink-2);
      color: var(--paper);
      padding: 10px 11px;
    }
    .meta-chip { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--ink-2); color: var(--paper-dim); font: 10px var(--mono); }
    .meta-chip.demo { border-color: rgba(233, 121, 69, 0.5); color: #f0b18f; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .objective-grid, .spawn-grid {
      display: grid;
      gap: 10px;
    }
    .objective-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .spawn-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .objective-button, .spawn-card {
      min-height: 88px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--ink-2);
      text-align: left;
      cursor: pointer;
    }
    .objective-button.is-active, .spawn-card.is-active { border-color: var(--aqua); color: var(--aqua); }
    .spawn-card strong, .objective-button strong { display: block; font-size: 16px; }
    .spawn-card span, .objective-button span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .plan-card, .stepper {
      border: 1px solid rgba(233, 121, 69, 0.35);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(233, 121, 69, 0.1), rgba(255,255,255,0.02));
      overflow: hidden;
    }
    .plan-head, .stepper { padding: 16px; }
    .plan-head h2, .stepper h2, .stepper h3 { margin: 6px 0 8px; font-family: var(--display); font-size: 26px; }
    .plan-steps { padding: 8px 16px 16px; }
    .plan-step { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    .plan-step:last-child { border-bottom: 0; }
    .loadout { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .loadout span { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--ink-2); font: 10px var(--mono); }
    .progress-track { height: 4px; margin: 10px 0 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
    .progress-track i { display: block; height: 100%; background: var(--signal); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 100;
      max-width: calc(100vw - 32px);
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
      font-size: 12px;
      transform: translate(-50%, 24px);
      opacity: 0;
      pointer-events: none;
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); transition: opacity 150ms ease, transform 150ms ease; }
    @media (max-width: 720px) {
      .side-grid, .objective-grid, .detail-grid { grid-template-columns: 1fr; }
      .maps-grid { grid-template-columns: 1fr; }
      .screen { padding: 14px 12px 28px; }
      #radar { width: 100%; max-height: calc(100dvh - var(--header-h) - var(--banner-h) - 56px); }
      .screen-lineup .detail-stage, .detail-media, .detail-media img { min-height: 48vh; max-height: 52vh; }
    }
    @media (max-width: 420px) {
      #screenTitle { font-size: 18px; }
      .header-chip { padding-left: 8px; padding-right: 8px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .radar-shell { min-height: calc(100dvh - var(--header-h) - var(--banner-h)); }
      #radar { max-height: calc(100dvh - var(--header-h) - var(--banner-h) - 52px); }
      .screen-lineup .detail-stage, .detail-media, .detail-media img { min-height: 70dvh; max-height: 70dvh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }

  </style>
</head>
<body>
  <a class="skip-link" href="#screenHost">跳到当前页面</a>
  <div class="app">
    <header class="nav-header">
      <button id="backButton" type="button">返回</button>
      <h1 id="screenTitle" tabindex="-1">选择地图</h1>
      <div id="screenActions"></div>
    </header>
    <div class="demo-boundary" role="status">
      <span aria-hidden="true">△</span>
      雷达底图来自 CS2 官方游戏资源；投掷物标点仍为交互演示数据，未经实战复投，不能作为可靠投掷依据。
    </div>
    <main id="screenHost" aria-labelledby="screenTitle"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script id="lineups-data">

  <script id="lineups-core">

    /**

    // Canonical hashes: #/maps #/side/mirage #/radar/mirage/T/nearby #/nearby/mirage/T/512/386 #/lineup/mirage/demo-t-window-smoke #/radar/mirage/T/opening #/opening/mirage/T/spawn/mirage-t-01/objective #/opening/mirage/T/plan/demo-plan-t-mid #/opening/mirage/T/plan/demo-plan-t-mid/step/1 #/favorites

    const LEGACY_STORAGE_KEY = "cs2-lineups-map.v1";
    const NADE_LABELS = { smoke: "烟", flash: "闪", molotov: "火", he: "雷" };
    const NADE_ORDER = ["smoke", "flash", "molotov", "he"];
    const FRAME_ORDER = ["stance", "aim", "result"];
    const FRAME_LABELS = { stance: "站位图", aim: "瞄点图", result: "落点图" };
    const SCREEN_IDS = [
      "maps", "side", "radar", "nearby", "lineup",
      "favorites", "opening-objective", "opening-plan", "opening-step"
    ];

    const DEFAULT_USER_STATE = {
      schemaVersion: 2,
      defaultSide: "T",
      favorites: [],
      notes: {},
      recent: [],
      opening: {
        mapId: null,
        side: null,
        spawnId: null,
        objective: null,

      }
    };

    function availableMapIds() {
      return MAP_DIRECTORY.filter(function(entry) { return entry.status === "available"; }).map(function(entry) { return entry.id; });
    }

    function getDirectoryEntry(mapId) {
      return MAP_DIRECTORY.find(function(entry) { return entry.id === mapId; }) || null;
    }

    function getMapData(mapId) {
      return MAP_CATALOG[mapId] || null;
    }

    function isAvailableMap(mapId) {
      const entry = getDirectoryEntry(mapId);
      return !!(entry && entry.status === "available" && getMapData(mapId));
    }

    function isSide(value) {
      return value === "T" || value === "CT";
    }

    function permittedLineup(lineup) {
      return !!lineup && (lineup.status === "active" || (DEMO_MODE && lineup.status === "demo"));
    }

    function permittedPlan(plan) {
      return !!plan && (plan.status === "active" || (DEMO_MODE && plan.status === "demo"));
    }

    function validPoint(point) {
      return !!(point && Number.isFinite(Number(point.x)) && Number.isFinite(Number(point.y)) &&
        Number(point.x) >= 0 && Number(point.x) <= 1000 && Number(point.y) >= 0 && Number(point.y) <= 1000);
    }

    function normalizePoint(point) {
      if (!validPoint(point)) return null;
      return { x: Math.round(Number(point.x)), y: Math.round(Number(point.y)), layerId: "main" };
    }

    function getZoneById(id, mapData) {
      return mapData.zones.find(function(zone) { return zone.id === id; }) || null;
    }

    function getStationById(id, mapData) {
      return mapData.startStations.find(function(station) { return station.id === id; }) || null;
    }

    function getSpawnById(id, mapData) {
      return mapData.spawnAnchors.find(function(spawn) { return spawn.id === id; }) || null;
    }

    function getLineupById(id, mapData) {
      return mapData.lineups.find(function(lineup) { return lineup.id === id; }) || null;
    }

      return mapData.openingPlans.find(function(plan) { return plan.id === id; }) || null;
    }

      const ids = Object.keys(MAP_CATALOG);
      for (let i = 0; i < ids.length; i += 1) {
        const mapData = MAP_CATALOG[ids[i]];
        const lineup = getLineupById(lineupId, mapData);
        if (lineup) return { mapId: ids[i], mapData: mapData, lineup: lineup };
      }
      return null;
    }

    function validLineupId(id) {
      const found = findLineupAnywhere(id);
      return !!(found && permittedLineup(found.lineup));

    function findZoneForPoint(point, zones) {
      if (!point) return null;
      return zones.find(function(zone) {
        return zone.layerId === (point.layerId || "main") && pointInPolygon(point, zone.polygon);
      }) || null;
    }

    function pointInPolygon(point, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][0], yi = polygon[i][1];
        const xj = polygon[j][0], yj = polygon[j][1];

        if (intersects) inside = !inside;

      return inside;

    function polygonCenter(polygon) {
      const total = polygon.reduce(function(acc, point) {
        acc.x += point[0];
        acc.y += point[1];

      return { x: total.x / polygon.length, y: total.y / polygon.length };

      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return dx * dx + dy * dy;

    function serializeRoute(route) {

          return "#/side/" + normalized.mapId;
        case "radar":
          return "#/radar/" + normalized.mapId + "/" + normalized.side + "/" + (normalized.radarMode || "nearby");
